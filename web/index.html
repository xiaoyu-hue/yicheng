<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一键成城 · 一键生成一座古城</title>
<style>
  :root { --ink:#3d2c17; --sub:#6d5836; --paper:#f3e9d2; --card:#efe3c8; --line:#8a734f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Songti SC","STSong","SimSun",serif; background:var(--paper); color:var(--ink); }
  header { max-width:1080px; margin:0 auto; padding:22px 16px 6px; }
  h1 { margin:0; font-size:30px; letter-spacing:2px; }
  header p { margin:6px 0 0; color:var(--sub); font-size:15px; }
  .bar { max-width:1080px; margin:12px auto; padding:0 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, select, input { font-family:inherit; font-size:16px; color:var(--ink); background:var(--card);
    border:1.5px solid var(--line); border-radius:8px; padding:8px 14px; }
  button { cursor:pointer; }
  button:hover { background:#e6d3a3; }
  button.primary { background:#7d6750; color:#f7efdb; border-color:#5d4a35; }
  button.primary:hover { background:#5d4a35; }
  input[type=number] { width:150px; }
  .stage { max-width:1080px; margin:6px auto 30px; padding:0 16px; }
  .stage .frame { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#e7d9b8; }
  .stage svg { display:block; width:100%; height:auto; }
  .hint { max-width:1080px; margin:0 auto 26px; padding:0 16px; color:var(--sub); font-size:14px; line-height:1.7; }
  #stage3d canvas { display: block; width: 100%; }
  #recordLine { max-width:1080px; margin:0 auto; padding:0 16px; text-align:center; color:var(--sub); font-size:15px; }
  #statsLine { max-width:1080px; margin:4px auto 10px; padding:0 16px; text-align:center; color:#96835f; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>一键成城</h1>
  <p>点一下，生成一座只属于这颗种子的古城：城墙、城门、街道、坊市，全是算出来的。</p>
</header>

<div class="bar">
  <button class="primary" id="btnNew">换一座城</button>
  <label>种子 <input type="number" id="seedInput"></label>
  <button id="btnGo">按种子找城</button>
  <label>规模
    <select id="sizeSel">
      <option value="town">小城</option>
      <option value="city" selected>中城</option>
      <option value="capital">大城</option>
    </select>
  </label>
  <label>格局
    <select id="modeSel">
      <option value="organic" selected>山水格局</option>
      <option value="grid">棋盘格局</option>
      <option value="water">水乡格局</option>
      <option value="region">一郡之地</option>
    </select>
  </label>
  <label>皮肤
    <select id="themeSel">
      <option value="" selected>宣纸</option>
      <option value="spring">春</option>
      <option value="autumn">秋</option>
      <option value="winter">冬</option>
      <option value="night">夜</option>
    </select>
  </label>
  <button id="btnPNG">下载 PNG</button>
  <button id="btnSVG">下载 SVG</button>
  <button id="btnPoster">下载海报</button>
  <button id="btnLink">复制城链接</button>
  <button id="btn2d" class="primary">平面图</button>
  <button id="btn3d">立体沙盘</button>
</div>

<div class="stage" id="stage2dWrap"><div class="frame" id="stage">正在建城…</div></div>
<div class="stage" id="stage3dWrap" hidden><div class="frame"><div id="stage3d"></div><p id="note3d" hidden style="text-align:center;color:#6d5836;padding:26px 12px;margin:0">郡图沙盘在路上——先切回平面图看郡；单城三种格局都可以立体看。</p></div></div>
<p id="recordLine"></p>
<p id="statsLine"></p>

<p class="hint">玩法：种子就是一座城的身份证——点「复制城链接」把当前这座城的链接发给朋友，对方点开看到的城和你一模一样。
SVG 是矢量图（放大不糊，适合打印装裱），PNG 是普通图片（适合发朋友圈）。所有生成都在你本机完成，不上传任何数据。</p>

<script src="three.min.js?v=5.0.2"></script>
<script src="orbit-controls.js?v=5.0.2"></script>
<script src="scene3d.js?v=5.0.2"></script>
<script>
  const stage = document.getElementById('stage');
  const seedInput = document.getElementById('seedInput');
  const sizeSel = document.getElementById('sizeSel');
  const modeSel = document.getElementById('modeSel');
  const themeSel = document.getElementById('themeSel');
  let curSeed = 20261120, curSVG = '';

  // 种子链接：网址带 ?seed= 与 &size=，打开链接直达那座城
  const params = new URLSearchParams(location.search);
  const pSeed = parseInt(params.get('seed'), 10);
  if (!Number.isNaN(pSeed)) curSeed = pSeed;
  if (['town', 'city', 'capital'].includes(params.get('size'))) sizeSel.value = params.get('size');
  if (['grid', 'water', 'region'].includes(params.get('mode'))) modeSel.value = params.get('mode');
  const sizeNamesCity = ['小城', '中城', '大城'];
  const sizeNamesRegion = ['小郡 · 3 县', '中郡 · 4 县', '大郡 · 5 县'];
  function syncSizeLabels() {
    const names = modeSel.value === 'region' ? sizeNamesRegion : sizeNamesCity;
    [...sizeSel.options].forEach((o, i) => { o.textContent = names[i]; });
  }
  syncSizeLabels();
  if (['spring', 'autumn', 'winter', 'night'].includes(params.get('theme'))) themeSel.value = params.get('theme');

  function syncURL() {
    try {
      history.replaceState(null, '', location.pathname + '?seed=' + curSeed + '&size=' + sizeSel.value + '&mode=' + modeSel.value + (themeSel.value ? '&theme=' + themeSel.value : ''));
    } catch (e) { /* 个别浏览器环境不允许改地址，忽略 */ }
  }

  const recordLine = document.getElementById('recordLine');
  const statsLine = document.getElementById('statsLine');
  async function load(seed, size, mode, theme) {
    stage.textContent = '正在建城…';
    const q = '?seed=' + encodeURIComponent(seed) + '&size=' + encodeURIComponent(size) + '&mode=' + encodeURIComponent(mode) + '&theme=' + encodeURIComponent(theme);
    const res = await fetch('/api/city' + q);
    curSVG = await res.text();
    curSeed = seed;
    seedInput.value = seed;
    stage.innerHTML = curSVG;
    try {
      const rec = await (await fetch('/api/record' + q)).json();
      recordLine.textContent = rec.line;
      statsLine.textContent = rec.stats.map(s => s[0] + ' ' + s[1]).join(' · ');
    } catch (e) { /* 城谱拿不到不影响看图 */ }
    syncURL();
    if (view3d) refresh3d();
  }

  // —— 立体沙盘（5.0）——
  let viewer = null, view3d = false;
  const wrap3d = document.getElementById('stage3dWrap');
  const stage3dEl = document.getElementById('stage3d');
  const note3d = document.getElementById('note3d');
  function ensureViewer() {
    if (viewer || !window.THREE || !window.YC3D) return viewer;
    viewer = YC3D.createViewer(THREE, stage3dEl, async () => {
      const q = '?seed=' + encodeURIComponent(curSeed) + '&size=' + encodeURIComponent(sizeSel.value) + '&mode=' + encodeURIComponent(modeSel.value) + '&theme=' + encodeURIComponent(themeSel.value);
      return await (await fetch('/api/scene' + q)).json();
    });
    return viewer;
  }
  async function refresh3d() {
    const v = ensureViewer();
    if (!v) { note3d.textContent = '立体引擎加载失败，请刷新页面重试。'; note3d.hidden = false; return; }
    v.setVisible(true);
    const r = await v.refresh();
    note3d.hidden = r !== 'region';
    stage3dEl.style.display = r === 'region' ? 'none' : '';
  }
  function setView(v3) {
    view3d = v3;
    document.getElementById('btn2d').classList.toggle('primary', !v3);
    document.getElementById('btn3d').classList.toggle('primary', v3);
    document.getElementById('stage2dWrap').hidden = v3;
    wrap3d.hidden = !v3;
    if (viewer) viewer.setVisible(v3);
    if (v3) refresh3d();
  }
  document.getElementById('btn2d').onclick = () => setView(false);
  document.getElementById('btn3d').onclick = () => setView(true);
  document.getElementById('btnNew').onclick = () => load(Math.floor(Math.random() * 900000000) + 1, sizeSel.value, modeSel.value, themeSel.value);
  document.getElementById('btnGo').onclick = () => {
    const v = parseInt(seedInput.value, 10);
    if (!Number.isNaN(v)) load(v, sizeSel.value, modeSel.value, themeSel.value);
  };
  sizeSel.onchange = () => load(curSeed, sizeSel.value, modeSel.value, themeSel.value);
  modeSel.onchange = () => { syncSizeLabels(); load(curSeed, sizeSel.value, modeSel.value, themeSel.value); };
  themeSel.onchange = () => load(curSeed, sizeSel.value, modeSel.value, themeSel.value);
  document.getElementById('btnSVG').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([curSVG], { type: 'image/svg+xml' }));
    a.download = 'yicheng-' + curSeed + '.svg';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById('btnPNG').onclick = () => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = 2560; cv.height = 1920;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(bd => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(bd);
        a.download = 'yicheng-' + curSeed + '.png';
        a.click();
        URL.revokeObjectURL(a.href);
      });
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(new Blob([curSVG], { type: 'image/svg+xml' }));
  };
  document.getElementById('btnPoster').onclick = async () => {
    const q = '?seed=' + encodeURIComponent(curSeed) + '&size=' + encodeURIComponent(sizeSel.value) + '&mode=' + encodeURIComponent(modeSel.value) + '&theme=' + encodeURIComponent(themeSel.value);
    const poster = await (await fetch('/api/poster' + q)).text();
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = 900; cv.height = 1350;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(bd => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(bd);
        a.download = 'yicheng-poster-' + curSeed + '.png';
        a.click();
        URL.revokeObjectURL(a.href);
      });
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(new Blob([poster], { type: 'image/svg+xml' }));
  };
  document.getElementById('btnLink').onclick = async (ev) => {
    syncURL();
    const btn = ev.currentTarget;
    try {
      await navigator.clipboard.writeText(location.href);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = location.href;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = '复制城链接'; }, 1600);
  };
  load(curSeed, sizeSel.value, modeSel.value, themeSel.value);
</script>
</body>
</html>
